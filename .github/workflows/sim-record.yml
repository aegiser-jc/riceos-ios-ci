# Records the RiceOS account-deletion path on an iOS Simulator (App Review evidence). Same app/ + ios/ as build 12, Release, unsigned.
# Hits the live backend (https://riceos.donaus.com): registers one test phone, deletes it in the UI; an always() step deletes it via the API if the UI run stopped early.
# PIN is generated per run and masked; never in the repo or logs. The raw ui.log is not uploaded.
name: sim-record
on:
  workflow_dispatch:
    inputs:
      phones:
        description: test phones tried in order (only 0899123401 / 07-10)
        default: '0899123408,0899123409,0899123410,0899123407,0899123401'
permissions:
  contents: read
concurrency:
  group: ios
  cancel-in-progress: false
jobs:
  record:
    runs-on: macos-26
    timeout-minutes: 50
    env:
      REC_PHONES: ${{ inputs.phones }}
    steps:
      - name: Run-time PIN (masked)
        run: |
          PIN=$(python3 - <<'PY'
          import secrets
          while True:
              p = ''.join(secrets.choice('0123456789') for _ in range(6))
              d = [int(c) for c in p]; steps = {d[i+1]-d[i] for i in range(5)}
              if len(set(p)) >= 5 and steps not in ({1}, {-1}, {0}) and p not in ('000000','123456','654321','121212','112233'): print(p); break
          PY
          )
          echo "::add-mask::$PIN"
          echo "REC_PIN=$PIN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Select newest Xcode (same as ios.yml)
        run: |
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1); [ -n "$X" ] && sudo xcode-select -s "$X"; xcodebuild -version
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Copy app/ into the iOS bundle
        run: |
          cd ios && ./sync-www.sh
          echo "app files: $(find www -type f | wc -l)"; grep -o "riceos-next-v[0-9]*" www/sw.js | head -1
          grep -c "ลบบัญชีและข้อมูลของคุณเรียบร้อยแล้ว" www/js/app.js
      - name: Capacitor sync (npm ci + pod install)
        run: |
          cd ios && npm ci --no-audit --no-fund
          npx cap sync ios
      - name: Pick simulator (newest iOS, iPhone 17/16 class)
        run: |
          python3 rec/pick_sim.py | tee -a "$GITHUB_ENV"
      - name: Build RiceOS for the simulator (Release, no signing)
        run: |
          set -o pipefail
          cd ios/ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphonesimulator -destination "id=$SIM_UDID" -derivedDataPath "$GITHUB_WORKSPACE/app-dd" ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build | tail -15
          A="$GITHUB_WORKSPACE/app-dd/Build/Products/Release-iphonesimulator/App.app"; test -d "$A"; echo "APP_PATH=$A" >> "$GITHUB_ENV"
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' -c 'Print CFBundleShortVersionString' -c 'Print CFBundleVersion' "$A/Info.plist"
      - name: Build UI driver (XcodeGen + build-for-testing)
        run: |
          set -o pipefail
          brew install xcodegen >/dev/null
          cd rec && xcodegen generate
          xcodebuild build-for-testing -project RecUI.xcodeproj -scheme RecUITests -destination "id=$SIM_UDID" -derivedDataPath "$GITHUB_WORKSPACE/rec-dd" | tail -15
      - name: Record + drive the deletion path
        run: bash rec/record.sh
      - name: Ensure the test account is deleted (API)
        if: always()
        run: python3 rec/cleanup.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riceos-sim-video
          path: |
            out/raw.mp4
            out/marks.txt
            out/rec.log
          if-no-files-found: warn
