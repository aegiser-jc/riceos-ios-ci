.splash img{width:88px;height:88px;border-radius:22px}.splash b{font-size:30px}.splash p{margin:0;font-size:20px;line-height:1.4}
.splash .bar{width:min(260px,70vw);height:8px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden}
.splash .bar i{display:block;width:40%;height:100%;border-radius:99px;background:#7cc243;animation:splashbar 1.4s ease-in-out infinite}
@keyframes splashbar{0%{margin-left:-40%}100%{margin-left:100%}}
.splash .slow{opacity:0;transition:opacity .4s;font-size:18px;color:#d8eccb}.splash .slow.on{opacity:1}
